[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

# This is the crucial line from the forum post.
# It tells PlatformIO to use a custom version of the Arduino framework
# that has Bluepad32 pre-integrated and patched to work correctly.
platform_packages =
  framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip

# These build flags are also recommended to ensure Bluetooth is enabled.
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BT_ENABLED=1